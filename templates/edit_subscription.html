{% extends "base.html" %}
{% block content %}
<section class="form-card">
    <h1>Edit Subscription</h1>
    <form method="POST">
        <label>Subscription Name</label>
        <input type="text" name="name" value="{{ subscription.name }}" required>

        <label>Category</label>
        <select name="category">{% for item in ['Entertainment','Music','Software','Gaming','Education','Fitness','Design','Other'] %}<option value="{{ item }}" {% if subscription.category == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select>

        <div class="two-col">
            <div><label>Price</label><input type="number" min="0" step="0.01" name="price" value="{{ subscription.price }}" required></div>
            <div><label>Currency</label><select name="currency">{% for item in ['NGN','USD','GBP','EUR'] %}<option value="{{ item }}" {% if subscription.currency == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></div>
        </div>

        <label>Billing Cycle</label>
        <select name="billing_cycle">{% for item in ['Weekly','Monthly','Yearly'] %}<option value="{{ item }}" {% if subscription.billing_cycle == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select>

        <label>Next Renewal Date</label>
        <input type="date" name="renewal_date" value="{{ subscription.renewal_date }}" required>

        <label>Remind Me</label>
        <select name="reminder_days">{% for days in [1,3,7,14] %}<option value="{{ days }}" {% if subscription.reminder_days == days %}selected{% endif %}>{{ days }} day{% if days != 1 %}s{% endif %} before</option>{% endfor %}</select>

        <label>Reminder Email</label>
        <input type="email" name="reminder_email" value="{{ subscription.reminder_email or '' }}">

        <label>Status</label>
        <select name="status"><option value="Active" {% if subscription.status == 'Active' %}selected{% endif %}>Active</option><option value="Cancelled" {% if subscription.status == 'Cancelled' %}selected{% endif %}>Cancelled</option></select>

        <button class="primary-button full" type="submit">Save Changes</button>
        <a class="cancel-link" href="{{ url_for('index') }}">Cancel</a>
    </form>
</section>
{% endblock %}
